name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-alpha.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish
    # Keep this on the same macOS/Xcode generation as local dev machines
    # (Xcode 26 / macOS 26 SDK). Dev builds only ever run against the current
    # SDK; releasing from a two-generations-older toolchain (macos-15 linked
    # releases against SDK 15.5) means shipping binaries whose AppKit behavior
    # nobody has exercised.
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # apple/project.yml's PulpEditor SPM dependency is a sibling repo
      # (path: ../../pulp, per the container layout documented in the
      # top-level CLAUDE.md) — not part of this checkout, so pull it in
      # ourselves. actions/checkout refuses a `path` outside $GITHUB_WORKSPACE
      # ("../pulp" errors as escaping it), so check it out as a subdirectory
      # instead and symlink it to the sibling location project.yml expects.
      #
      # The checkout is pinned to the commit in ./pulp.ref (updated whenever a
      # release should pick up new Pulp work) so releases are reproducible —
      # an unpinned default-branch checkout ships whatever Pulp main happens
      # to be at build time.
      - name: Resolve pinned Pulp ref
        id: pulp
        run: echo "ref=$(cat pulp.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out Pulp editor
        uses: actions/checkout@v4
        with:
          repository: tijs/pulp
          path: pulp
          ref: ${{ steps.pulp.outputs.ref }}

      - name: Link Pulp editor as a sibling of this checkout
        run: ln -s "$GITHUB_WORKSPACE/pulp" "$GITHUB_WORKSPACE/../pulp"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install xcodegen and cargo-swift
        run: |
          set -euo pipefail
          brew install xcodegen
          cargo install cargo-swift

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build, package, and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          SIGNING_IDENTITY: Developer ID Application
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/release/*.sh
          PRIVATE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$PRIVATE_KEY_PATH"
          chmod 600 "$PRIVATE_KEY_PATH"
          export APPLE_API_PRIVATE_KEY_PATH="$PRIVATE_KEY_PATH"
          scripts/release/release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          TAG="v$VERSION"
          DMG="dist/Kiem-$VERSION.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --title "Kiem $VERSION" \
              --prerelease \
              --notes-file CHANGELOG.md
          fi
