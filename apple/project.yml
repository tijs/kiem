# xcodegen spec for the Kiem macOS app. Regenerate with:
#   cd apple && xcodegen generate
# Prerequisite: apple/build-kiemkit.sh (KiemKit is generated, gitignored).
name: Kiem
options:
  bundleIdPrefix: org.tijs
  # Current-generation floor only (matches the Pulp package's macOS 26 floor);
  # there is no legacy-OS support target.
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  KiemKit:
    path: KiemKit
  PulpEditor:
    path: ../../pulp
targets:
  Kiem:
    type: application
    platform: macOS
    sources: [Kiem]
    # Fail loudly if the embedded Rust core (KiemKit) is older than its sources.
    # xcodebuild can't see crates/*.rs -> KiemKit, so a stale core silently
    # clobbers note metadata on edit. See docs/solutions/integration-issues/
    # stale-prebuilt-kiemkit-xcframework-clobbers-tags-2026-06-20.md
    preBuildScripts:
      - name: Check KiemKit freshness
        basedOnDependencyAnalysis: false
        script: |
          ref="$SRCROOT/KiemKit/Sources/KiemKit/kiem_ffi.swift"
          if [ ! -f "$ref" ]; then
            echo "error: KiemKit not built. Run apple/build-kiemkit.sh first."
            exit 1
          fi
          # Only library src compiles into KiemKit; tests/benches don't, so
          # changing them must not trip the guard.
          stale=$(find "$SRCROOT/../crates" -path '*/src/*' -name '*.rs' -newer "$ref" -print -quit)
          if [ -n "$stale" ]; then
            echo "error: Rust core changed since KiemKit was generated ($stale). The embedded core is stale and will clobber note metadata on edit. Run apple/build-kiemkit.sh, then rebuild."
            exit 1
          fi
    # Embed the kiem CLI binary into the app bundle's Resources so the in-app
    # "Install Command Line Tool" command can symlink it onto PATH. Release builds
    # compile the CLI fresh; Debug reuses an existing target/debug build to keep
    # day-to-day app builds fast (building it only if absent).
    postCompileScripts:
      - name: Embed kiem CLI
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$dest"
          if [ "$CONFIGURATION" = "Release" ]; then
            ( cd "$SRCROOT/.." && cargo build -p kiem-cli --release )
            cp "$SRCROOT/../target/release/kiem" "$dest/kiem"
          else
            bin="$SRCROOT/../target/debug/kiem"
            [ -x "$bin" ] || ( cd "$SRCROOT/.." && cargo build -p kiem-cli )
            cp "$bin" "$dest/kiem"
          fi
    dependencies:
      - package: KiemKit
        product: KiemKit
      - package: PulpEditor
        product: Pulp
      # iroh (via kiem-sync, embedded in KiemKit) pulls in hickory-resolver /
      # system-configuration / netdev for DNS + network-state introspection,
      # which need these system frameworks explicitly linked or the Release
      # build fails at link time with undefined symbols.
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreWLAN.framework
    info:
      path: Kiem/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        # Local-network privacy: iroh (kiem-sync) dials paired peers directly
        # on the LAN. (The old _kiem._tcp NSBonjourServices entry left with the
        # Bonjour discovery stack — iroh pairs by ticket, no service browsing.)
        NSLocalNetworkUsageDescription: "Kiem syncs your notes directly with your paired Kiem devices on your local network."
        CFBundleURLTypes:
          - CFBundleURLName: org.tijs.kiem.note
            CFBundleURLSchemes:
              - kiem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "26"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Dev builds run unsandboxed: the app shares ~/.kiem with the CLI.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
  Kiem iOS:
    type: application
    platform: iOS
    sources: [Kiem iOS]
    # The iOS app is no longer an empty shell: it links the same Rust-backed
    # KiemKit store (macOS + iOS slices, generated by build-kiemkit.sh) and the
    # Pulp package (whose platform-neutral core — ContentAnalyzer — is reused
    # for derived title/tags). Keep the guard so a stale embedded Rust core
    # can't clobber note metadata on edit.
    preBuildScripts:
      - name: Check KiemKit freshness
        basedOnDependencyAnalysis: false
        script: |
          ref="$SRCROOT/KiemKit/Sources/KiemKit/kiem_ffi.swift"
          if [ ! -f "$ref" ]; then
            echo "error: KiemKit not built. Run apple/build-kiemkit.sh first."
            exit 1
          fi
          stale=$(find "$SRCROOT/../crates" -path '*/src/*' -name '*.rs' -newer "$ref" -print -quit)
          if [ -n "$stale" ]; then
            echo "error: Rust core changed since KiemKit was generated ($stale). Run apple/build-kiemkit.sh, then rebuild."
            exit 1
          fi
    dependencies:
      - package: KiemKit
        product: KiemKit
      - package: PulpEditor
        product: Pulp
      # iroh (via kiem-sync, embedded in KiemKit's iOS slices) needs these
      # system frameworks for DNS + network-state introspection. CoreWLAN is
      # macOS-only and omitted here; Network.framework provides the nw_path_*
      # symbols iroh's netdev binding uses on iOS.
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem.ios
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kiem syncs your notes directly with your paired Kiem devices on your local network."
        INFOPLIST_KEY_CFBundleDisplayName: Kiem
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # CODE_SIGN_IDENTITY is empty (not the XcodeGen default "iPhone
        # Developer"): simulator/test builds sign locally automatically.
        # DEVELOPMENT_TEAM is pinned to the same team the rest of the
        # projects use (9Z77B473HX); leave the identity empty and real
        # signing materializes for device/archive builds.
        DEVELOPMENT_TEAM: 9Z77B473HX
        CODE_SIGN_IDENTITY: ""

  # iOS unit tests drive the platform-neutral model against a real KiemKit
  # scratch store (temp dir), then the real app in a throwaway KIEM_DATA_DIR.
  Kiem iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Kiem iOSTests]
    dependencies:
      - target: Kiem iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem.iosTests
        SWIFT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  Kiem iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Kiem iOSUITests]
    dependencies:
      - target: Kiem iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem.iosUITests
        SWIFT_VERSION: "6"
        TEST_TARGET_NAME: Kiem iOS
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  # UI tests drive the real app against a throwaway KIEM_DATA_DIR — the only
  # sanctioned way to automate SwiftUI List selection, keyboard shortcuts,
  # and quit/relaunch checks (AppleScript/synthetic events can't; see the
  # blank-editor and keyboard-delete sagas). Run: cd apple && xcodebuild test
  # -project Kiem.xcodeproj -scheme Kiem | xcsift  (takes over the machine
  # while running).
  KiemUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [KiemUITests]
    dependencies:
      - target: Kiem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem.uitests
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6"
        TEST_TARGET_NAME: Kiem
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
# Explicit scheme (xcodegen stops auto-generating one once test targets need
# wiring). archive stays Release — scripts/release/archive.sh depends on it.
schemes:
  Kiem:
    build:
      targets:
        Kiem: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KiemUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Kiem iOS:
    build:
      targets:
        Kiem iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Kiem iOSTests
        - Kiem iOSUITests
    profile:
      config: Release
    archive:
      config: Release
