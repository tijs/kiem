# xcodegen spec for the Kiem macOS app. Regenerate with:
#   cd apple && xcodegen generate
# Prerequisite: apple/build-kiemkit.sh (KiemKit is generated, gitignored).
name: Kiem
options:
  bundleIdPrefix: org.tijs
  deploymentTarget:
    macOS: "14.0"
packages:
  KiemKit:
    path: KiemKit
  PulpEditor:
    path: ../../pulp
targets:
  Kiem:
    type: application
    platform: macOS
    sources: [Kiem]
    # Fail loudly if the embedded Rust core (KiemKit) is older than its sources.
    # xcodebuild can't see crates/*.rs -> KiemKit, so a stale core silently
    # clobbers note metadata on edit. See docs/solutions/integration-issues/
    # stale-prebuilt-kiemkit-xcframework-clobbers-tags-2026-06-20.md
    preBuildScripts:
      - name: Check KiemKit freshness
        basedOnDependencyAnalysis: false
        script: |
          ref="$SRCROOT/KiemKit/Sources/KiemKit/kiem_ffi.swift"
          if [ ! -f "$ref" ]; then
            echo "error: KiemKit not built. Run apple/build-kiemkit.sh first."
            exit 1
          fi
          # Only library src compiles into KiemKit; tests/benches don't, so
          # changing them must not trip the guard.
          stale=$(find "$SRCROOT/../crates" -path '*/src/*' -name '*.rs' -newer "$ref" -print -quit)
          if [ -n "$stale" ]; then
            echo "error: Rust core changed since KiemKit was generated ($stale). The embedded core is stale and will clobber note metadata on edit. Run apple/build-kiemkit.sh, then rebuild."
            exit 1
          fi
    # Embed the kiem CLI binary into the app bundle's Resources so the in-app
    # "Install Command Line Tool" command can symlink it onto PATH. Release builds
    # compile the CLI fresh; Debug reuses an existing target/debug build to keep
    # day-to-day app builds fast (building it only if absent).
    postCompileScripts:
      - name: Embed kiem CLI
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$dest"
          if [ "$CONFIGURATION" = "Release" ]; then
            ( cd "$SRCROOT/.." && cargo build -p kiem-cli --release )
            cp "$SRCROOT/../target/release/kiem" "$dest/kiem"
          else
            bin="$SRCROOT/../target/debug/kiem"
            [ -x "$bin" ] || ( cd "$SRCROOT/.." && cargo build -p kiem-cli )
            cp "$bin" "$dest/kiem"
          fi
    dependencies:
      - package: KiemKit
        product: KiemKit
      - package: PulpEditor
        product: Pulp
      # iroh (via kiem-sync, embedded in KiemKit) pulls in hickory-resolver /
      # system-configuration / netdev for DNS + network-state introspection,
      # which need these system frameworks explicitly linked or the Release
      # build fails at link time with undefined symbols.
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreWLAN.framework
    # Explicit Info.plist (generated by xcodegen) so we can declare the Bonjour
    # service array, which GENERATE_INFOPLIST_FILE can't express.
    info:
      path: Kiem/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        # Local-network privacy (macOS 15+): required to advertise and browse the
        # _kiem._tcp Bonjour service the P2P sync (U8) uses.
        NSLocalNetworkUsageDescription: "Kiem discovers and syncs your notes with other Kiem devices on your local network."
        NSBonjourServices:
          - _kiem._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tijs.kiem
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "6"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Dev builds run unsandboxed: the app shares ~/.kiem with the CLI.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
