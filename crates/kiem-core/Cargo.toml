[package]
name = "kiem-core"
version = "0.1.0"
edition = "2021"
description = "Kiem core library: shared note logic that is the single source of truth across CLI, FFI, and app surfaces."

[dependencies]
automerge = "0.10"
autosurgeon = "0.12"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
