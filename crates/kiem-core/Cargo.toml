[package]
name = "kiem-core"
version = "0.1.0-alpha.2"
edition = "2021"
description = "Kiem core library: shared note logic that is the single source of truth across CLI, FFI, and app surfaces."

[dependencies]
automerge = "0.10"
autosurgeon = "0.12"
regex = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tantivy = "0.26.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

[features]
serde = ["dep:serde"]
