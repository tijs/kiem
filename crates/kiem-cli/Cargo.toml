[package]
name = "kiem-cli"
version = "0.1.0"
edition = "2021"
description = "Kiem CLI: human- and agent-facing command line interface over kiem-core."

[[bin]]
name = "kiem"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
kiem-core = { path = "../kiem-core", features = ["serde"] }
mdns-sd = "0.20.0"
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
