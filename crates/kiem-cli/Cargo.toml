[package]
name = "kiem-cli"
version = "0.1.0-alpha.4"
edition = "2021"
description = "Kiem CLI: human- and agent-facing command line interface over kiem-core."

[[bin]]
name = "kiem"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
iroh = "1.0.1"
kiem-core = { path = "../kiem-core", features = ["serde"] }
kiem-sync = { path = "../kiem-sync" }
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
