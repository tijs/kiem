[package]
name = "kiem-sync"
version = "0.3.1"
edition = "2021"
description = "Kiem sync transport: iroh-based P2P connections (identity, discovery, relay), feeding kiem-core's SyncEngine."

[dependencies]
iroh = "1.0.1"
iroh-tickets = "1.0.0"
kiem-core = { path = "../kiem-core" }
hostname = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }

[dev-dependencies]
tempfile = "3.27.0"
