[package]
name = "kiem-ffi"
version = "0.1.0-alpha.9"
edition = "2021"
description = "Kiem FFI: thin UniFFI bridge exposing kiem-core to Swift."

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
kiem-core = { path = "../kiem-core" }
kiem-sync = { path = "../kiem-sync" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = "0.31.1"

[dev-dependencies]
tempfile = "3.27.0"
